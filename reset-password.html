<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارتك | استعادة كلمة المرور - satr-tech.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0B132B;
            --bg-secondary: #1E3A8A;
            --accent: #38BDF8;
            --brand-green: #145239;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --danger: #EF4444;
            --success: #10B981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #0F2856 50%, var(--bg-primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 36px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .logo-badge {
            width: 82px;
            height: 82px;
            margin: 0 auto 16px;
            border-radius: 22px;
            background: linear-gradient(135deg, #1E3A8A, #0B132B);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.35);
            border: 2px solid rgba(56, 189, 248, 0.35);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 22px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .form-group {
            text-align: right;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #CBD5E1;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563EB;
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            margin-top: 8px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1E3A8A, #0F2856);
            color: #FFFFFF;
        }

        .btn-secondary {
            background: #F1F5F9;
            color: #1E293B;
            border: 1px solid #CBD5E1;
            margin-top: 12px;
            display: inline-block;
            text-decoration: none;
        }

        .status-box {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 18px;
            display: none;
        }

        .status-error {
            background: #FEF2F2;
            color: #B91C1C;
            border: 1px solid #FECACA;
            display: block;
        }

        .status-success {
            background: #ECFDF5;
            color: #047857;
            border: 1px solid #A7F3D0;
            display: block;
        }

        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-badge">إدارتك</div>
        <h1>تعيين كلمة مرور جديدة</h1>
        <p class="subtitle">منصة إدارتك لإدارة المدارس والحسابات — satr-tech.com</p>

        <div id="statusBox" class="status-box"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">كلمة المرور الجديدة</label>
                <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" required />
                <div class="hint">8 أحرف على الأقل وتحتوي على حرف كبير (A-Z) وحرف صغير (a-z) ورقم (0-9).</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
                <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required />
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary">حفظ كلمة المرور الجديدة</button>
        </form>

        <a id="openAppBtn" href="#" class="btn btn-secondary">فتح داخل تطبيق إدارتك مباشرة</a>

        <div class="footer">© satr-tech.com — نظام إدارتك</div>
    </div>

    <script>
        const SUPABASE_URL = "https://imzxfxgqaggqvsbzrtjm.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImltenhmeGdxYWdncXZzYnpydGptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NDcwMjIsImV4cCI6MjEwMTAyMzAyMn0.GK4ZJCMREJRcwLCkgGyXTzVLokrJZEg5hVxnk7xPhEQ";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusBox = document.getElementById("statusBox");
        const resetForm = document.getElementById("resetForm");
        const submitBtn = document.getElementById("submitBtn");
        const openAppBtn = document.getElementById("openAppBtn");

        function showStatus(msg, isError = false) {
            statusBox.textContent = msg;
            statusBox.className = "status-box " + (isError ? "status-error" : "status-success");
        }

        // تجهيز زر الفتح داخل التطبيق (Deep Link) مع تمرير الـ Hash
        const currentHash = window.location.hash || "";
        openAppBtn.href = "salapp://reset" + currentHash;

        // استخراج التوكن من الرابط في حال فتحه مباشرة
        async function initRecoverySession() {
            const hashParams = new URLSearchParams(currentHash.startsWith("#") ? currentHash.substring(1) : currentHash);
            const queryParams = new URLSearchParams(window.location.search);
            const flowType = hashParams.get("type") || queryParams.get("type") || "";

            if (flowType === "signup" || flowType === "email" || flowType === "invite") {
                document.querySelector("h1").textContent = "تم تأكيد الحساب بنجاح ✅";
                resetForm.style.display = "none";
                openAppBtn.style.display = "none";
                showStatus("تم تأكيد بريدك الإلكتروني وتفعيل حسابك بنجاح! يمكنك الآن إغلاق هذه الصفحة والعودة إلى تطبيق إدارتك لتسجيل الدخول.", false);
                return;
            }

            if (currentHash && currentHash.includes("access_token=")) {
                const access_token = hashParams.get("access_token");
                const refresh_token = hashParams.get("refresh_token") || "";
                if (access_token) {
                    const { error } = await supabaseClient.auth.setSession({ access_token, refresh_token });
                    if (error) {
                        showStatus("انتهت صلاحية رابط الاستعادة أو تم استخدامه مسبقاً. يرجى طلب رابط جديد من التطبيق.", true);
                    }
                }
            }
        }

        initRecoverySession();

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const pwd = document.getElementById("newPassword").value.trim();
            const confirmPwd = document.getElementById("confirmPassword").value.trim();

            if (pwd !== confirmPwd) {
                showStatus("كلمتا المرور غير متطابقتين!", true);
                return;
            }

            const strongEnough = pwd.length >= 8 && /[a-z]/.test(pwd) && /[A-Z]/.test(pwd) && /\d/.test(pwd);
            if (!strongEnough) {
                showStatus("كلمة المرور ضعيفة: يجب أن تتكون من 8 أحرف على الأقل وتحتوي على حرف كبير وصغير ورقم.", true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "جاري الحفظ...";

            const { error } = await supabaseClient.auth.updateUser({ password: pwd });

            submitBtn.disabled = false;
            submitBtn.textContent = "حفظ كلمة المرور الجديدة";

            if (error) {
                showStatus("تعذر تحديث كلمة المرور: انتهت صلاحية الرابط أو أنه غير صالح. اطلب رابطاً جديداً من التطبيق.", true);
                return;
            }

            showStatus("تم تغيير كلمة المرور بنجاح! يمكنك الآن العودة لتطبيق إدارتك وتسجيل الدخول.", false);
            resetForm.style.display = "none";
        });
    </script>
</body>
</html>
